<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Date Bingo ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header>
            <h1>Our Date Bingo ❤️</h1>
            <p class="subtitle">
                Porque a distância não significa que deixamos de ter dates.
            </p>

            <div class="progress">
                <span id="completed-count">0</span> / 25 dates completed
            </div>
        </header>


        <section class="bingo-container">

            <div id="bingo-board" class="bingo-board">

                <!-- As casas do bingo vão ser criadas pelo JavaScript -->

            </div>

        </section>


        <section class="info">

            <p>
                💕 Completem os dates e tentem fazer uma linha!
            </p>

            <button id="reset-button">
                Reset Bingo
            </button>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
